name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat-implementa

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Flet
        run: |
          pip install flet==0.28.3

      - name: Build APK com Flet
        run: |
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk/*.apk
